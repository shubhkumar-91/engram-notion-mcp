name: Publish Engram (Dual Stack)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to publish'
        required: true
        default: 'both'
        type: choice
        options:
        - both
        - python
        - node

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  # 1. Publish Python Version (PyPI)
  publish-pypi:
    runs-on: ubuntu-latest
    if: inputs.target == 'python' || inputs.target == 'both'
    steps:
      - uses: actions/checkout@v6
        name: Checkout repo

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.16"
          enable-cache: "true"

      - name: Build Python Package
        working-directory: ./python
        run: |
          cp ../README.md README.md
          uv build

      - name: Publish package distributions to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  # 2. Publish Bun Version (NPM)
  publish-npm:
    runs-on: ubuntu-latest
    if: inputs.target == 'node' || inputs.target == 'both'
    steps:
      - uses: actions/checkout@v6
        name: Checkout repo

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install
        working-directory: ./node

      - name: Build Compilation Check
        run: bun run build
        working-directory: ./node

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Publish NPM Package
        working-directory: ./node
        run: |
          cp ../README.md README.md
          VERSION=$(node -p "require('./package.json').version")
          echo $VERSION
          if [[ $VERSION == *"-"* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
