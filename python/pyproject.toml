[project]
name = "engram-notion-mcp"
version = "1.1.1"
description = "The permanent and semantic memory layer for AI agents"
dependencies = [
    "mcp",
    "fastmcp",
    "notion-client",
    "python-dotenv"
]
requires-python = ">=3.10"
authors = [
  { name = "Shubham Kumar", email = "shubhkumar-9153@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
urls = { Repository = "https://github.com/shubhkumar-91/engram-notion-mcp" }
scripts = { "engram-notion-mcp" = "engram_notion_mcp.server:mcp.run" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
